name: PR Quality

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node build and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/*.test.mjs tests/forest-v3/*.test.mjs src/forest-v3/world/*.test.mjs src/forest-v3/domain/*.test.mjs

  python:
    name: Python regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: python -B -m unittest discover -s tests -p 'test_*.py'

  gate:
    name: PR quality gate
    needs: [node, python]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both test jobs to succeed
        env:
          NODE_RESULT: ${{ needs.node.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
        run: |
          printf 'Node: %s\nPython: %s\n' "$NODE_RESULT" "$PYTHON_RESULT"
          test "$NODE_RESULT" = success && test "$PYTHON_RESULT" = success
