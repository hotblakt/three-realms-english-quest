<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132921">
  <title>霧竹林｜美術工作台</title>
</head>
<body class="forest-preview">
  <main id="stage">
    <div id="game" aria-label="霧竹林可步行場景"></div>
    <header class="forest-hud">
      <h1>霧竹林</h1>
      <p id="forest-message" role="status">沿石路走到溪邊，找木橋過溪。</p>
    </header>
    <nav class="forest-tools" aria-label="原型工具">
      <details id="composition">
        <summary>構圖設定</summary>
        <div class="composition-options">
          <label>角色 <select name="character"><option value="original">現用影空</option><option value="candidate" selected>影空 2.0</option></select></label>
          <label>角色高度 <select name="size"><option>100</option><option>140</option><option selected>160</option><option>180</option></select><span>%</span></label>
          <label>2.0 貼圖邊長 <select name="resolution"><option>192</option><option selected>256</option><option>384</option></select></label>
          <label>鏡頭倍率 <select name="zoom"><option>1.0</option><option selected>1.15</option><option>1.3</option><option>1.45</option></select></label>
          <label>視窗 <select name="viewport"><option value="classic">原始</option><option value="immersive" selected>沉浸滿版</option></select></label>
          <div class="composition-toggles">
            <label><input type="checkbox" name="smoothing" checked>平滑跟隨</label>
            <label><input type="checkbox" name="shadow" checked>接地陰影</label>
            <label><input type="checkbox" name="light" checked>環境光</label>
          </div>
          <p>影空 2.0 採四向站姿暫看比例。貼圖邊長以像素計。</p>
        </div>
      </details>
      <a class="forest-back" href="%BASE_URL%art-workbench/">返回工作台</a>
    </nav>
    <div id="controls" aria-label="遊戲觸控">
      <div id="stick" aria-label="移動搖桿"><div id="knob"></div></div>
      <div id="actions">
        <button data-action="interact">互動</button>
        <button data-action="dodge">閃避</button>
        <button data-action="attack">揮劍</button>
      </div>
    </div>
    <p id="keyboard">方向鍵／WASD 移動　J 揮劍　空白鍵閃避　E 互動</p>
  </main>
  <section id="rotate-device" hidden aria-labelledby="rotate-title">
    <h2 id="rotate-title" tabindex="-1">請將裝置轉為橫向</h2>
    <p>橫向遊玩，才能看清林間的路。</p>
  </section>
  <script type="module" src="./main.ts"></script>
</body>
</html>
