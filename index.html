<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16251e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="三界探險">
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/app-180.png">
  <link rel="icon" type="image/png" href="%BASE_URL%icons/app-192.png">
  <title data-text="gameName"></title>
</head>
<body>
  <main id="stage">
    <div id="game"></div>
    <section id="title">
      <p class="eyebrow" data-text="chapterOne"></p>
      <h1><span data-text="title"></span><span data-text="subtitle"></span></h1>
      <p data-text="windAwakening"></p>
      <button id="begin" data-text="enterVillage" disabled></button>
      <small data-text="landscapeHint"></small>
      <details id="install-guide">
        <summary data-text="installTitle"></summary>
        <p data-text="installSteps"></p>
      </details>
    </section>
    <section id="hud" hidden data-label="gameStatus">
      <div id="location" class="eyebrow" data-text="hiddenBambooVillage"></div>
      <div id="health" data-label="healthLabel"></div>
      <div id="objective" role="status" aria-atomic="true"></div>
    </section>
    <aside id="dialogue" hidden role="dialog" aria-labelledby="dialogue-speaker" aria-describedby="line">
      <div class="dialogue-panel">
        <strong id="dialogue-speaker" data-text="elderGeno"></strong>
        <p id="line" data-text="genoTraining"></p>
        <div class="dialogue-actions">
          <button id="open-speaking" data-text="speakingPractice"></button>
          <button id="close-dialogue" data-text="continue"></button>
        </div>
      </div>
    </aside>
    <section id="speaking" hidden role="dialog" aria-modal="true" aria-labelledby="speaking-title"
      aria-describedby="speaking-guidance speaking-note">
      <div class="dialogue-panel speaking-panel">
        <div class="speaking-content">
          <div class="speaking-heading">
            <h2 id="speaking-title" data-text="speakingPractice" tabindex="-1"></h2>
            <button id="recognize-voice" hidden data-text="recognizeVoice" aria-describedby="recognition-privacy"></button>
          </div>
          <p id="speaking-guidance" data-text="speakingGuidance"></p>
          <p class="speaking-example"><strong id="speaking-prompt"></strong>
            <span data-text="runMeaning"></span>
          </p>
          <small id="speaking-note" data-text="practiceOnly"></small>
          <small id="recognition-privacy" hidden data-text="recognitionPrivacy"></small>
          <div id="recognition-result" hidden>
            <p id="recognition-status" role="status"></p>
            <p id="recognized-text" aria-live="polite" hidden>
              <span data-text="recognizedText"></span> <span id="recognized-transcript" lang="en-US"></span>
            </p>
          </div>
        </div>
        <div class="speaking-actions">
          <button id="listen-guidance" data-text="listenGuidance"></button>
          <button id="replay-english" data-text="replayEnglish"></button>
          <button id="record-voice" data-text="startRecording"></button>
          <button id="replay-recording" data-text="replayRecording" disabled></button>
          <button id="complete-speaking" data-text="practiceDone" hidden></button>
          <button id="close-speaking" data-text="backToGeno"></button>
          <p id="speaking-status" role="status" aria-atomic="true"></p>
        </div>
      </div>
    </section>
    <div id="controls" hidden>
      <div id="stick" data-label="movementJoystick"><div id="knob"></div></div>
      <div id="actions">
        <button data-action="interact" data-text="talk"></button>
        <button data-action="dodge" data-text="dodge"></button>
        <button data-action="attack" data-text="slash"></button>
      </div>
    </div>
    <div id="keyboard" hidden data-text="keyboardHelp"></div>
  </main>
  <section id="rotate-device" hidden aria-labelledby="rotate-title">
    <h2 id="rotate-title" data-text="rotateTitle" tabindex="-1"></h2>
    <p data-text="rotateHint"></p>
  </section>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
